<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Certifications — CITCO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <meta name="description"
        content="Citco (Cheekanal Industries and Trading Company) is a leading producer of roasted and double filtered premium coconut oil, based in Pathanamthitta, Kerala, India. Our oil is 100% pure, with no Additives and no preservatives, and holds the highest Agmark Grade 1 certification." />
    <meta name="keywords"
        content="Agmark certification, ISO certified, FSSAI certified, ZED certified, Nanma certified, quality assurance" />
    <meta property="og:title" content="Certifications — CITCO" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Our certifications and quality assurances." />
    <meta property="og:image" content="./assets/agmark-logo.gif" />
</head>

<body>
    <div id="header"></div>
    <main class="container">
        <h1>Certifications</h1>
        <div class="cert-grid">
            <figure>
                <img src="./assets/agmark-logo.gif" alt="AGMARK Grade 1" />
                <figcaption>AGMARK Grade 1</figcaption>
            </figure>
            <figure>
                <img src="./assets/fssai-logo.svg" alt="FSSAI Certified" />
                <figcaption>FSSAI Certified</figcaption>
            </figure>
            <figure>
                <img src="./assets/zed-logo.svg" alt="ZED Certified" />
                <figcaption>ZED Certified</figcaption>
            </figure>
            <figure>
                <img src="./assets/nanma-logo.svg" alt="Nanma Certified" />
                <figcaption>Nanma Certified</figcaption>
            </figure>
        </div>
    </main>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
